<!DOCTYPE html>
<html lang="hu" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2E7D32" id="theme-meta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AllergyTrack">
  <link rel="manifest" href="manifest.json">
  <title>AllergyTrack v1.5.0 – Allergia Napló</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- Background pattern -->
  <div class="page-bg-pattern" aria-hidden="true"></div>

  <!-- ── Loading Screen ─────────────────────── -->
  <div id="loading-screen">
    <div class="loading-logo">
      <div class="loading-icon">🌿</div>
      <h1>AllergyTrack</h1>
      <p>Allergia Napló &amp; Követő</p>
    </div>
    <div class="loading-spinner"></div>
  </div>

  <!-- ── App Content ───────────────────────── -->
  <div id="app-content" style="display:none">

    <!-- Header -->
    <header class="app-header">
      <button class="icon-btn" id="menu-btn" aria-label="Menü">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="header-logo">
        <div class="logo-icon">🌿</div>
        <div class="header-title-group">
          <h1>AllergyTrack</h1>
          <div class="header-location" id="header-location" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="10" height="10">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <span id="header-location-text"></span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="theme-btn" aria-label="Téma váltás">
          <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1"  x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22"  x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1"  y1="12" x2="3"  y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <!-- Profil gomb – körök avatárral / monogrammal -->
        <button class="profile-btn" id="profile-btn" aria-label="Profil és beállítások">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="16" height="16">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main page content -->
    <main id="page-content"></main>

    <!-- Bottom navigation -->
    <nav class="bottom-nav" role="navigation" aria-label="Főnavigáció">
      <a class="nav-item active" data-page="dashboard" href="#" role="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Főoldal</span>
      </a>
      <a class="nav-item" data-page="pollen" href="#" role="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2a10 10 0 0 1 0 20 10 10 0 0 1 0-20"/>
          <path d="M12 9c-3 0-5 1.5-5 3s2 3 5 3 5-1.5 5-3-2-3-5-3"/>
        </svg>
        <span>Pollen</span>
      </a>
      <!-- FAB in nav center -->
      <button class="nav-fab-btn" id="fab-btn" aria-label="Új naplóbejegyzés">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <a class="nav-item" data-page="log" href="#" role="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <span>Napló</span>
      </a>
      <a class="nav-item" data-page="analytics" href="#" role="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span>Elemzés</span>
      </a>
    </nav>

    <!-- FAB is now inside the bottom nav (nav-fab-btn) -->

  </div><!-- /app-content -->

  <!-- ── Drawer ─────────────────────────────── -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <nav class="drawer" id="drawer" role="navigation" aria-label="Oldalsó menü">
    <div class="drawer-header">
      <div class="drawer-logo">🌿</div>
      <div>
        <div class="title">AllergyTrack</div>
        <div class="subtitle">Allergia Napló</div>
      </div>
    </div>
    <div class="drawer-nav">
      <div class="drawer-section-label">Főoldalak</div>
      <div class="drawer-item active" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Vezérlőpult
      </div>
      <div class="drawer-item" data-page="log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        Tünetnapló
      </div>
      <div class="drawer-item" data-page="pollen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
        </svg>
        Pollenadatok
      </div>
      <div class="drawer-item" data-page="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        Elemzés
      </div>
      <div class="drawer-item" data-page="knowledge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        Tudástár
      </div>
      <div class="drawer-section-label" style="margin-top:8px">Beállítások</div>
      <div class="drawer-item" data-page="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Allergia profil
      </div>
      <div class="drawer-item" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Beállítások
      </div>
    </div>
    <div style="padding: 16px; border-top: 1px solid var(--border);">
      <div style="font-size:11px; color:var(--text-muted); text-align:center; line-height:1.6">
        AllergyTrack <span id="drawer-version">v1.5.0</span><br>
        Adatok helyi eszközön · opcionális felhő szink
      </div>
    </div>
  </nav>

  <!-- ── Toast container ───────────────────── -->
  <div id="toasts" role="status" aria-live="polite"></div>

  <!-- ── Modal ─────────────────────────────── -->
  <div id="modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <div id="modal-content"></div>
  </div>

</div><!-- /app -->

<!-- ═══ External libraries ═══ -->
<script>
  /* PDF.js worker config — set before loading the lib */
  window.pdfjsWorkerSrc = 'libs/pdf.worker.min.js';
</script>
<script src="libs/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- Supabase JS SDK (offline módban is betöltödik, de nem fut ha nincs konfigurálva) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>

<!-- ═══ App modules ═══ -->
<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/pdfParser.js"></script>
<script src="js/patchNotes.js"></script>
<script src="js/weatherService.js"></script>
<script src="js/notifications.js"></script>
<script src="js/geoLocation.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/userProfile.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/logEntry.js"></script>
<script src="js/pollenData.js"></script>
<script src="js/analytics.js"></script>
<script src="js/pollenFetcher.js"></script>
<script src="js/pollenMap.js"></script>
<script src="js/profile.js"></script>
<script src="js/settings.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>

<!-- ═══ PWA Service Worker regisztráció ═══ -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' })
        .then(reg => console.info('[SW] Regisztrálva:', reg.scope))
        .catch(err => console.warn('[SW] Regisztráció hiba:', err));
    });
  }
</script>

</body>
</html>
